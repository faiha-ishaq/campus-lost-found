spring.application.name=lostandfound

# In-memory H2 Database configuration
spring.datasource.url=jdbc:h2:mem:lostfounddb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Web Console to inspect database tables in your browser
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate auto-creates tables based on your Java entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
management.endpoints.web.exposure.include=health,info,metrics